# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy Node.js app to Azure Web App - boostworks

on:
  push:
    branches:
      - 'main'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'

      # Tests use dev dependencies (in-memory MongoDB), so install everything,
      # test, then remove dev dependencies before packaging.
      - name: Install dependencies and run tests
        run: |
          npm ci
          npm test

      - name: Remove dev dependencies
        run: npm prune --omit=dev

      # node_modules is shipped inside the zip, so the app starts without
      # needing a build on the Azure side.
      - name: Zip artifact for deployment
        run: zip -r -q release.zip . -x '.git/*' '.github/*' '*.log' '.env'

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: release.zip

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_C322F5CC62F3479FB209E337C4344865 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_058972185F7E44E197D8059ABB7DD091 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_892773B48B9948F8B3FA79B69C4E7D78 }}

      - name: 'Deploy to Azure Web App'
        uses: azure/webapps-deploy@v3
        id: deploy-to-webapp
        with:
          app-name: 'boostworks'
          slot-name: 'Production'
          package: release.zip
